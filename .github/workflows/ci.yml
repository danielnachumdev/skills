name: CI

# Thin orchestrator. Prefer requiring checks "CI / CI" and "CI / Validate skills".
# Semver omitted: this repo does not publish versioned artifacts.
# allow-empty: markdown skills only (no pyproject.toml / package.json).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
    with:
      allow-empty: true

  # Dogfood skills-ref validation here; extract script+job into
  # danielnachumdev/actions later (script under scripts/ is the portable unit).
  validate-skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Validate skills
        run: ./scripts/validate_skills.sh

  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [ci, validate-skills]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@latest

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
    with:
      allow-empty: true

  validate-skills:
    name: Validate skills
    # DEBUG: call known-good reusable workflow to isolate startup_failure
    uses: danielnachumdev/actions/.github/workflows/github-yaml.yml@latest

  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [ci, validate-skills]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@latest

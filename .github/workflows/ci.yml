name: CI

# Thin orchestrator. Prefer requiring checks "CI / CI" and
# "Validate skills / Validate skills".
# Semver omitted: this repo does not publish versioned artifacts.
# allow-empty: markdown skills only (no pyproject.toml / package.json).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
    with:
      allow-empty: true

  validate-skills:
    name: Validate skills
    # Pin the actions commit that introduced validate-skills.yml until @latest
    # is retagged after https://github.com/danielnachumdev/actions/pull/41.
    uses: danielnachumdev/actions/.github/workflows/validate-skills.yml@9701251d75468681c1149cf089c04d279263185b

  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [ci, validate-skills]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@latest
